{{- if .Values.camunda.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: camunda
  namespace: {{ .Values.global.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: {{ .Values.global.argoProject }}
  destination:
    namespace: {{ .Values.global.namespace }}
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: "30s"
        factor: 2
        maxDuration: "10m0s"
  source:
    repoURL: "{{ .Values.camunda.repoURL }}"
    chart: "{{ .Values.camunda.chart }}"
    # renovate: datasource=helm depName=camunda-platform registryUrl=https://helm.camunda.io
    targetRevision: "{{ .Values.camunda.chartVersion }}"
    helm:
      valuesObject:
        # Zeebe only. Operate, Tasklist, Optimize, Identity and Connectors are
        # non-production-only without an Enterprise licence; without them
        # nothing reads Elasticsearch, so no exporter is configured.
        global:
          identity:
            auth:
              enabled: false
          elasticsearch:
            enabled: false

        zeebe:
          clusterSize: "1"
          partitionCount: "1"
          replicationFactor: "1"
          pvcSize: 10Gi

        zeebeGateway:
          replicas: 1

        operate:
          enabled: false

        tasklist:
          enabled: false

        optimize:
          enabled: false

        identity:
          enabled: false

        identityKeycloak:
          enabled: false

        connectors:
          enabled: false

        elasticsearch:
          enabled: false
{{- end }}
