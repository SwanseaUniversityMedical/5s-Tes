{{- if .Values.camunda.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: camunda
  namespace: {{ .Values.global.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: {{ .Values.global.argoProject }}
  destination:
    namespace: {{ .Values.global.namespace }}
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: "30s"
        factor: 2
        maxDuration: "10m0s"
  source:
    repoURL: "{{ .Values.camunda.repoURL }}"
    chart: "{{ .Values.camunda.chart }}"
    # renovate: datasource=helm depName=camunda-platform registryUrl=https://helm.camunda.io
    targetRevision: "{{ .Values.camunda.chartVersion }}"
    helm:
      valuesObject:
        global:
          identity:
            auth:
              enabled: false

          ingress:
            enabled: {{ .Values.global.ingress.enabled }}
            className: {{ .Values.global.ingress.className }}
            host: "camunda.{{ .Values.global.ingress.host }}"
            annotations:
              ingress.kubernetes.io/rewrite-target: "/"
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
              nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
              nginx.ingress.kubernetes.io/proxy-buffering: "on"
              nginx.ingress.kubernetes.io/proxy-body-size: "10m"
              {{- if .Values.global.ingress.tls }}
              cert-manager.io/cluster-issuer: "{{ .Values.global.ingress.certClusterIssuer }}"
              {{- end }}
            tls:
              enabled: {{ .Values.global.ingress.tls }}
              secretName: camunda-tls

          zeebeClusterName: camunda-zeebe

        webModeler:
          enabled: false

        identity:
          enabled: false

        identityKeycloak:
          enabled: false

        connectors:
          contextPath: "/connectors"

        orchestration:
          replicas: 1
          clusterSize: "1"
          partitionCount: "1"
          replicationFactor: "1"
          pvcSize: 10Gi
          contextPath: "/orchestration"
          security:
            authentication:
              unprotectedApi: true

            authorizations:
              enabled: false

          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution: []

        elasticsearch:
          master:
            replicaCount: 1
            persistence:
              size: 10Gi

        optimize:
          enabled: false

        prometheusServiceMonitor:
          enabled: false
{{- end }}
