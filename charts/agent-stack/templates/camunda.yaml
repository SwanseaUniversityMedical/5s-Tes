{{- if .Values.camunda.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: camunda
  namespace: {{ .Values.global.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: {{ .Values.global.argoProject }}
  destination:
    namespace: {{ .Values.global.namespace }}
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: "30s"
        factor: 2
        maxDuration: "10m0s"
  source:
    repoURL: "{{ .Values.camunda.repoURL }}"
    chart: "{{ .Values.camunda.chart }}"
    # renovate: datasource=helm depName=camunda-platform registryUrl=https://helm.camunda.io
    targetRevision: "{{ .Values.camunda.chartVersion }}"
    helm:
      valuesObject:
        # Zeebe + Elasticsearch only. Operate, Tasklist, Optimize, Identity and
        # Connectors are non-production-only without an Enterprise licence.
        global:
          identity:
            auth:
              enabled: false

        zeebe:
          clusterSize: "1"
          partitionCount: "1"
          replicationFactor: "1"
          pvcSize: 10Gi

        zeebeGateway:
          replicas: 1

        operate:
          enabled: false

        tasklist:
          enabled: false

        optimize:
          enabled: false

        identity:
          enabled: false

        identityKeycloak:
          enabled: false

        connectors:
          enabled: false

        elasticsearch:
          # Upstream moved these tags to the frozen bitnamilegacy repository;
          # the org mirror carries them under bitnami/, with the full Bitnami
          # tag rather than the bare version the chart assumes.
          image:
            registry: "{{ .Values.camunda.bitnamiRegistry }}"
            repository: bitnami/elasticsearch
            tag: "{{ .Values.camunda.elasticsearchTag }}"
          sysctlImage:
            registry: "{{ .Values.camunda.bitnamiRegistry }}"
            repository: bitnami/os-shell
            tag: "{{ .Values.camunda.osShellTag }}"
          master:
            replicaCount: 1
            persistence:
              size: 10Gi
{{- end }}
