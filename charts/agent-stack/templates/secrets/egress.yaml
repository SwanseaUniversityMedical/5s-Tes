{{- if and .Values.vault.secretsEnabled .Values.egress.enabled }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: egress-api-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
  output:
    name: egress-api-secret
    stringData:
      connectionString: {{ printf "Server=pg-pooler;Port=5432;Database=%s;User Id=postgres;Password={{ .secret.postgres_password }}" .Values.postgres.egressDatabase | squote }}
      treKeycloakClientSecret: {{`'{{ .secret.kc_tre_api_client_secret }}'`}}
      dataEgressKeycloakClientSecret: {{`'{{ .secret.kc_egress_api_client_secret }}'`}}
      s3AccessKey: {{`'{{ .secret.s3_access_key }}'`}}
      s3SecretKey: {{`'{{ .secret.s3_secret_key }}'`}}
      encryptionKey: {{`'{{ .secret.egress_encryption_key }}'`}}
      encryptionBase: {{`'{{ .secret.egress_encryption_base }}'`}}
      demoModeDefaultPassword: {{`'{{ .secret.egress_demo_mode_default_password }}'`}}
    type: Opaque

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: egress-ui-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
  output:
    name: egress-ui-secret
    stringData:
      keycloakClientSecret: {{`'{{ .secret.kc_egress_ui_client_secret }}'`}}
    type: Opaque
{{- end }}
