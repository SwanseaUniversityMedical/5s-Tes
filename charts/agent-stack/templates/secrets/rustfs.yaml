{{- if and .Values.vault.secretsEnabled .Values.rustfs.enabled }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: agent-rustfs-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - connection:
        address: {{ .Values.vault.address }}
      authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}/rustfs
  output:
    name: agent-rustfs-secret
    stringData:
      # Keys the rustfs chart itself reads via envFrom. Values must equal
      # agent-api-secret's s3AccessKey/s3SecretKey.
      RUSTFS_ACCESS_KEY: {{`'{{ .secret.access_key }}'`}}
      RUSTFS_SECRET_KEY: {{`'{{ .secret.secret_key }}'`}}
    type: Opaque
{{- end }}
