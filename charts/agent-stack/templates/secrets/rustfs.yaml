{{- if and .Values.vault.secretsEnabled .Values.rustfs.enabled }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: agent-rustfs-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
  output:
    name: agent-rustfs-secret
    stringData:
      # Keys the rustfs chart itself reads via envFrom; the same Vault pair
      # fills the api-side s3AccessKey/s3SecretKey.
      RUSTFS_ACCESS_KEY: {{`'{{ .secret.s3_access_key }}'`}}
      RUSTFS_SECRET_KEY: {{`'{{ .secret.s3_secret_key }}'`}}
    type: Opaque
{{- end }}
