{{- if and .Values.vault.secretsEnabled .Values.agent.enabled .Values.agent.teleport.enabled }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: teleport-user-management-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
  output:
    name: teleport-user-management-secret
    stringData:
      adUsername: {{`'{{ .secret.teleport_ad_username }}'`}}
      adPassword: {{`'{{ .secret.teleport_ad_password }}'`}}
      keycloakClientSecret: {{`'{{ .secret.kc_teleport_client_secret }}'`}}
      keycloakUsername: {{`'{{ .secret.teleport_kc_username }}'`}}
      keycloakPasswordEnc: {{`'{{ .secret.teleport_kc_password_enc }}'`}}
      # Direct to postgres-rw, not the pooler: a single job host does not
      # need pooling.
      connectionString: {{ printf "Host=postgres-rw;Port=5432;Database=%s;Username=postgres;Password={{ .secret.postgres_password }}" .Values.postgres.teleportDatabase | squote }}
      hangfireUsername: {{`'{{ .secret.teleport_hangfire_username }}'`}}
      hangfirePassword: {{`'{{ .secret.teleport_hangfire_password }}'`}}
      encryptionKey: {{`'{{ .secret.teleport_encryption_key }}'`}}
    type: Opaque
{{- end }}
