{{- if and .Values.vault.secretsEnabled .Values.agent.enabled .Values.agent.teleport.enabled }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: teleport-user-management-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}/teleport
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: postgres
      path: {{ .Values.vault.secretPath }}/postgres
  output:
    name: teleport-user-management-secret
    stringData:
      adUsername: {{`'{{ .secret.ad_username }}'`}}
      adPassword: {{`'{{ .secret.ad_password }}'`}}
      keycloakClientSecret: {{`'{{ .secret.keycloak_client_secret }}'`}}
      keycloakUsername: {{`'{{ .secret.keycloak_username }}'`}}
      keycloakPasswordEnc: {{`'{{ .secret.keycloak_password_enc }}'`}}
      # Derived from the postgres superuser password; direct to postgres-rw,
      # not the pooler — a single job host does not need pooling.
      connectionString: {{ printf "Host=postgres-rw;Port=5432;Database=%s;Username=postgres;Password={{ .postgres.postgres_password }}" .Values.postgres.teleportDatabase | squote }}
      hangfireUsername: {{`'{{ .secret.hangfire_username }}'`}}
      hangfirePassword: {{`'{{ .secret.hangfire_password }}'`}}
      encryptionKey: {{`'{{ .secret.encryption_key }}'`}}
    type: Opaque
{{- end }}
