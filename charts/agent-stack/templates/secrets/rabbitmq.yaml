{{- if and .Values.vault.secretsEnabled .Values.rabbitmq.vaultSecretDefaultUser (not .Values.rabbitmq.vaultDefaultUser) }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: rabbitmq-default-user-vault
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: rabbitmq
      path: {{ .Values.vault.secretPath }}/rabbitmq
  output:
    name: rabbitmq-default-user-vault
    stringData:
      username: {{ `'{{ .rabbitmq.username }}'` }}
      password: {{ `'{{ .rabbitmq.password }}'` }}
      # The one key the operator reads from secretBackend.externalSecret; it
      # mounts it as /etc/rabbitmq/conf.d/11-default_user.conf.
      default_user.conf: |
        default_user = {{ `{{ .rabbitmq.username }}` }}
        default_pass = {{ `{{ .rabbitmq.password }}` }}
    type: Opaque
{{- end }}
