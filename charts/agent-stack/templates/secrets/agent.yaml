      vaultToken: {{`'{{ .secret.vault_token }}'`}}
    type: Opaque
{{- end }}

{{- if and .Values.vault.secretsEnabled .Values.openldap.enabled }}

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: agent-openldap-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - connection:
        address: {{ .Values.vault.address }}
      authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}/ldap
  output:
    name: agent-openldap-secret
    stringData:
      # Keys the openldap-stack-ha chart's global.existingSecret contract
      # expects. LDAP_ADMIN_PASSWORD must equal credentials-camunda-secret's
      # ldapAdminPassword when agent.ldap.* points at this Application.
      LDAP_ADMIN_PASSWORD: {{`'{{ .secret.admin_password }}'`}}
      LDAP_CONFIG_ADMIN_PASSWORD: {{`'{{ .secret.config_password }}'`}}
    type: Opaque
{{- end }}
