{{- if and .Values.vault.secretsEnabled .Values.agent.enabled }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: agent-api-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - connection:
        address: {{ .Values.vault.address }}
      authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}/agent-api
  output:
    name: agent-api-secret
    stringData:
      connectionStringDefault: {{`'{{ .secret.connection_string_default }}'`}}
      connectionStringCredentials: {{`'{{ .secret.connection_string_credentials }}'`}}
      treKeycloakClientSecret: {{`'{{ .secret.tre_keycloak_client_secret }}'`}}
      submissionKeycloakClientSecret: {{`'{{ .secret.submission_keycloak_client_secret }}'`}}
      egressKeycloakClientSecret: {{`'{{ .secret.egress_keycloak_client_secret }}'`}}
      s3AccessKey: {{`'{{ .secret.s3_access_key }}'`}}
      s3SecretKey: {{`'{{ .secret.s3_secret_key }}'`}}
      rabbitUsername: {{`'{{ .secret.rabbit_username }}'`}}
      rabbitPassword: {{`'{{ .secret.rabbit_password }}'`}}
      encryptionKey: {{`'{{ .secret.encryption_key }}'`}}
      vaultToken: {{`'{{ .secret.vault_token }}'`}}
      hangfireUsername: {{`'{{ .secret.hangfire_username }}'`}}
      hangfirePassword: {{`'{{ .secret.hangfire_password }}'`}}
      hasuraAdminSecret: {{`'{{ .secret.hasura_admin_secret }}'`}}
    type: Opaque

---

