{{- if and .Values.vault.secretsEnabled .Values.agent.enabled }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: agent-api-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
    # The RabbitmqCluster's own default-user secret (operator key names).
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: rabbitmq
      path: {{ .Values.vault.secretPath }}/rabbitmq
  output:
    name: agent-api-secret
    stringData:
      # Composed here so Vault holds one postgres_password key.
      connectionStringDefault: {{ printf "Server=pg-pooler;Port=5432;Database=%s;User Id=postgres;Password={{ .secret.postgres_password }}" .Values.postgres.database | squote }}
      connectionStringCredentials: {{ printf "Server=pg-pooler;Port=5432;Database=%s;User Id=postgres;Password={{ .secret.postgres_password }}" .Values.postgres.credentialsDatabase | squote }}
      treKeycloakClientSecret: {{`'{{ .secret.kc_tre_ui_client_secret }}'`}}
      submissionKeycloakClientSecret: {{`'{{ .secret.kc_control_api_client_secret }}'`}}
      egressKeycloakClientSecret: {{`'{{ .secret.kc_egress_api_client_secret }}'`}}
      s3AccessKey: {{`'{{ .secret.s3_access_key }}'`}}
      s3SecretKey: {{`'{{ .secret.s3_secret_key }}'`}}
      rabbitUsername: {{`'{{ .rabbitmq.username }}'`}}
      rabbitPassword: {{`'{{ .rabbitmq.password }}'`}}
      encryptionKey: {{`'{{ .secret.encryption_key }}'`}}
      hangfireUsername: {{`'{{ .secret.hangfire_username }}'`}}
      hangfirePassword: {{`'{{ .secret.hangfire_password }}'`}}
      hasuraAdminSecret: {{`'{{ .secret.hasura_admin_secret }}'`}}
    type: Opaque

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: agent-ui-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
  output:
    name: agent-ui-secret
    stringData:
      keycloakClientSecret: {{`'{{ .secret.kc_tre_ui_client_secret }}'`}}
    type: Opaque

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: credentials-camunda-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
  output:
    name: credentials-camunda-secret
    stringData:
      connectionStringCredentials: {{ printf "Server=pg-pooler;Port=5432;Database=%s;User Id=postgres;Password={{ .secret.postgres_password }}" .Values.postgres.credentialsDatabase | squote }}
      # The external TRE data database; not composed, its host and user are
      # not this chart's.
      connectionStringTreData: {{`'{{ .secret.connection_string_tre_data }}'`}}
      ldapAdminPassword: {{`'{{ .secret.ldap_admin_password }}'`}}
    type: Opaque
{{- end }}

{{- if and .Values.vault.secretsEnabled .Values.openldap.enabled }}

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: agent-openldap-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
  output:
    name: agent-openldap-secret
    stringData:
      # Keys the openldap-stack-ha chart's global.existingSecret contract
      # expects; the same ldap_admin_password fills credentials-camunda-secret.
      LDAP_ADMIN_PASSWORD: {{`'{{ .secret.ldap_admin_password }}'`}}
      LDAP_CONFIG_ADMIN_PASSWORD: {{`'{{ .secret.ldap_config_password }}'`}}
    type: Opaque
{{- end }}
