{{- if .Values.seq.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.argoAppPrefix }}seq
  namespace: {{ include "agent-stack.argoNamespace" . }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: {{ .Values.global.argoProject }}
  destination:
    namespace: {{ .Values.global.namespace }}
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: "30s"
        factor: 2
        maxDuration: "10m0s"
  source:
    repoURL: "{{ .Values.seq.repoURL }}"
    chart: "{{ .Values.seq.chart }}"
    # renovate: datasource=helm depName=seq registryUrl=https://helm.datalust.co
    targetRevision: "{{ .Values.seq.chartVersion }}"
    helm:
      {{- if .Values.global.argoAppPrefix }}
      # Unprefixed, so nothing inside the release is renamed.
      releaseName: seq
      {{- end }}
      valuesObject:
        # All interfaces, not "*" - Seq parses this with System.Uri, which rejects "*" as a host.
        listenURI: "http://0.0.0.0:80,http://0.0.0.0:5341"

        firstRunAdminUsername: "admin"
        firstRunAdminPasswordSecret:
          name: "seq-admin-password-secret"
          key: "password"
        firstRunRequireAuthenticationForHttpIngestion: {{ .Values.seq.requireAuthForIngestion }}

        {{- if .Values.global.ingress.enabled }}
        {{- if .Values.global.ingress.tls }}
        baseURI: "https://{{ include "agent-stack.seqHost" . }}/"
        {{- else }}
        baseURI: "http://{{ include "agent-stack.seqHost" . }}/"
        {{- end }}

        ui:
          ingress:
            enabled: true
            path: /
            hosts:
              - {{ include "agent-stack.seqHost" . }}

        ingress:
          className: "{{ .Values.global.ingress.className }}"
          annotations:
            {{- if .Values.global.ingress.tls }}
            cert-manager.io/cluster-issuer: "{{ .Values.global.ingress.certClusterIssuer }}"
            {{- end }}
          {{- if .Values.global.ingress.tls }}
          tls:
            - hosts:
              - {{ include "agent-stack.seqHost" . }}
              secretName: seq-tls
          {{- end }}
        {{- end }}

        persistence:
          enabled: true
          storageClass: {{ .Values.global.storageClass }}
          size: "{{ .Values.seq.storageSize }}"

        resources:
          requests:
            cpu: {{ .Values.seq.resources.requests.cpu }}
            memory: {{ .Values.seq.resources.requests.memory }}
          limits:
            memory: {{ .Values.seq.resources.limits.memory }}
{{- end }}
