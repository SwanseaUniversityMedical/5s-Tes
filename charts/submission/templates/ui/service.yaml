{{- if .Values.ui.enabled -}}
apiVersion: v1
kind: Service
metadata:
  # Static: this is the name referenced by other charts as "submission-ui".
  name: submission-ui
  labels:
    {{- include "submission.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "submission.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
