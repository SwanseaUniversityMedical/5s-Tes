{{- if and .Values.ui.enabled .Values.ui.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "submission.fullname" . }}-ui
  labels:
    {{- include "submission.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.ingress.certClusterIssuer }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.global.ingress.host }}
      secretName: {{ include "submission.fullname" . }}-ui-tls
  {{- end }}
  rules:
    - host: {{ .Values.global.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ui.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: submission-ui
                port:
                  number: 80
{{- end }}
