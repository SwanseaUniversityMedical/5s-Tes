{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "submission.fullname" . }}-ui
  labels:
    {{- include "submission.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  # Shared ReadWriteOnce dataprotection PVC and in-memory session store;
  # cannot scale past one replica.
  replicas: 1
  selector:
    matchLabels:
      {{- include "submission.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "submission.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ include "submission.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dataprotection
          persistentVolumeClaim:
            claimName: submission-dataprotection
        {{- if .Values.global.trustClusterCa.enabled }}
        - name: certs-overlay
          configMap:
            name: {{ .Values.global.trustClusterCa.configMapName }}
            defaultMode: 420
        {{- end }}
      containers:
        - name: ui
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Values.global.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: dataprotection
              mountPath: {{ .Values.dataProtection.keysPath }}
            {{- if .Values.global.trustClusterCa.enabled }}
            - name: certs-overlay
              mountPath: {{ .Values.global.trustClusterCa.mountPath }}
              subPath: {{ .Values.global.trustClusterCa.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "{{ .Values.global.config.aspnetEnvironment }}"
            - name: UIName__Name
              value: "{{ .Values.ui.appName }}"
            # api's static Service name; the ui and api are always co-installed.
            - name: DareAPISettings__Address
              value: "http://submission-api"
            - name: DareAPISettings__HelpAddress
              value: "http://submission-api"
            - name: KeycloakDemoMode
              value: "{{ .Values.ui.keycloakDemoMode }}"
            - name: sslcookies
              value: "{{ .Values.ui.sslCookies }}"
            - name: httpsRedirect
              value: "{{ .Values.ui.httpsRedirect }}"
            - name: SuppressAntiforgery
              value: "{{ .Values.ui.suppressAntiforgery }}"
            - name: FormIOSettings__TreForm
              value: "{{ .Values.ui.formio.treForm }}"
            - name: FormIOSettings__UserForm
              value: "{{ .Values.ui.formio.userForm }}"
            - name: FormIOSettings__ProjectForm
              value: "{{ .Values.ui.formio.projectForm }}"
            - name: URLSettingsFrontEnd__QueryImageSQL
              value: "{{ .Values.ui.urlSettings.queryImageSql }}"
            - name: URLSettingsFrontEnd__QueryImageGraphQL
              value: "{{ .Values.ui.urlSettings.queryImageGraphQL }}"
            - name: URLSettingsFrontEnd__S3BaseUrl
              value: "{{ .Values.ui.s3ConsoleUrl }}"
            - name: URLSettingsFrontEnd__S3BucketPath
              value: "{{ .Values.ui.urlSettings.s3BucketPath }}"
            - name: SubmissionKeyCloakSettings__Authority
              value: "{{ .Values.global.oidc.authority }}/"
            - name: SubmissionKeyCloakSettings__MetadataAddress
              value: "{{ .Values.global.oidc.authority }}/.well-known/openid-configuration"
            - name: SubmissionKeyCloakSettings__BaseUrl
              value: "{{ .Values.global.oidc.authority }}"
            - name: SubmissionKeyCloakSettings__AccountManagementURL
              value: "{{ .Values.global.oidc.authority }}/account"
            - name: SubmissionKeyCloakSettings__ClientId
              value: "{{ .Values.ui.oidc.clientId }}"
            - name: SubmissionKeyCloakSettings__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.secretName }}
                  key: keycloakClientSecret
            - name: SubmissionKeyCloakSettings__RedirectURL
              value: "{{ .Values.ui.oidc.redirectUrl }}"
            - name: SubmissionKeyCloakSettings__UseRedirectURL
              value: "{{ .Values.ui.oidc.useRedirectUrl }}"
            - name: SubmissionKeyCloakSettings__Proxy
              value: "{{ .Values.ui.oidc.proxy }}"
            - name: SubmissionKeyCloakSettings__ProxyAddresURL
              value: "{{ .Values.ui.oidc.proxyAddresUrl }}"
            - name: SubmissionKeyCloakSettings__BypassProxy
              value: "{{ .Values.ui.oidc.bypassProxy }}"
            - name: DataProtectionSettings__PersistKeys
              value: "true"
            - name: DataProtectionSettings__KeysPath
              value: "{{ .Values.dataProtection.keysPath }}"
            - name: Serilog__SeqServerUrl
              value: "{{ .Values.global.config.seqUrl }}"
            - name: Serilog__MinimumLevel__Default
              value: "{{ .Values.global.config.logLevel }}"
            - name: Logging__LogLevel__Default
              value: "{{ .Values.global.config.logLevel }}"
            {{- if .Values.global.monitoring.enabled }}
            - name: PUSHGATEWAY_URL
              value: "{{ .Values.global.monitoring.pushgatewayUrl }}"
            - name: PUSHGATEWAY_JOB
              value: {{ .Release.Namespace }}-submission-ui
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
