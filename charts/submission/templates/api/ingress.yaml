{{- if and .Values.api.enabled .Values.api.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "submission.fullname" . }}-api
  labels:
    {{- include "submission.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.ingress.certClusterIssuer }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  # TLS for this shared host is declared on the ui Ingress; nginx-ingress
  # merges the certificate across every Ingress object for the same host.
  ingressClassName: {{ .Values.global.ingress.className }}
  rules:
    - host: {{ .Values.global.ingress.host }}
      http:
        paths:
          - path: {{ .Values.api.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: submission-api
                port:
                  number: 80
{{- end }}
