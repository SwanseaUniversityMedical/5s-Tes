{{- if and .Values.global.ingress.enabled .Values.web.enabled .Values.web.ingress.enabled -}}
{{- $host := .Values.web.ingress.host | default (printf "agent.%s" .Values.global.ingress.host) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent.fullname" . }}-web
  labels:
    {{- include "agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.ingress.certClusterIssuer }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tls }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: agent-web-tls
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-web
                port:
                  number: 80
{{- end }}
