{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}-web
  labels:
    {{- include "agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.global.trustClusterCa.enabled }}
      volumes:
        - name: certs-overlay
          configMap:
            name: {{ .Values.global.trustClusterCa.configMapName }}
            defaultMode: 420
      {{- end }}
      containers:
        - name: web
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Values.global.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- if .Values.global.trustClusterCa.enabled }}
          volumeMounts:
            - name: certs-overlay
              mountPath: {{ .Values.global.trustClusterCa.mountPath }}
              subPath: {{ .Values.global.trustClusterCa.key }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.secretName }}
                  key: betterAuthSecret
            - name: BETTER_AUTH_URL
              value: "{{ .Values.web.publicUrl }}"
            - name: KEYCLOAK_URL
              value: "{{ .Values.web.keycloakBaseUrl }}"
            - name: KEYCLOAK_CLIENT_ID
              value: "{{ .Values.web.oidc.clientId }}"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.secretName }}
                  key: keycloakClientSecret
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: "{{ .Values.web.keycloakBaseUrl }}"
            - name: NEXT_PUBLIC_KEYCLOAK_REALM
              value: "{{ .Values.web.oidc.realm }}"
            - name: NEXT_PUBLIC_HELPDESK_URL
              value: "{{ .Values.web.helpdeskUrl }}"
            # api's static Service name.
            - name: AGENT_API_URL
              value: "http://agent-api"
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
{{- end }}
