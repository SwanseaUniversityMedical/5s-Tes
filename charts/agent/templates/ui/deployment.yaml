{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}-ui
  labels:
    {{- include "agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  # In-memory session store (MemoryCacheTicketStore); cannot scale past one
  # replica.
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ include "agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.global.trustClusterCa.enabled }}
      volumes:
        - name: certs-overlay
          configMap:
            name: {{ .Values.global.trustClusterCa.configMapName }}
            defaultMode: 420
      {{- end }}
      containers:
        - name: ui
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Values.global.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          {{- if .Values.global.trustClusterCa.enabled }}
          volumeMounts:
            - name: certs-overlay
              mountPath: {{ .Values.global.trustClusterCa.mountPath }}
              subPath: {{ .Values.global.trustClusterCa.key }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "{{ .Values.global.config.aspnetEnvironment }}"
            - name: UIName__Name
              value: "{{ .Values.ui.appName }}"
            # api's static Service name; the ui and api are always co-installed.
            - name: TreAPISettings__InternalApiBaseUrl
              value: "http://agent-api"
            - name: KeycloakDemoMode
              value: "{{ .Values.ui.keycloakDemoMode }}"
            - name: sslcookies
              value: "{{ .Values.ui.sslCookies }}"
            - name: httpsRedirect
              value: "{{ .Values.ui.httpsRedirect }}"
            - name: TreKeyCloakSettings__AccountManagementURL
              value: "{{ .Values.global.oidc.authority }}/account"
            - name: TreKeyCloakSettings__Authority
              value: "{{ .Values.global.oidc.authority }}/.well-known/openid-configuration"
            - name: TreKeyCloakSettings__MetadataAddress
              value: "{{ .Values.global.oidc.authority }}/.well-known/openid-configuration"
            - name: TreKeyCloakSettings__ClientId
              value: "{{ .Values.ui.oidc.clientId }}"
            - name: TreKeyCloakSettings__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ui.secretName }}
                  key: keycloakClientSecret
            - name: TreKeyCloakSettings__Proxy
              value: "{{ .Values.ui.oidc.proxy }}"
            - name: TreKeyCloakSettings__ProxyAddresURL
              value: "{{ .Values.ui.oidc.proxyAddresUrl }}"
            - name: TreKeyCloakSettings__BypassProxy
              value: "{{ .Values.ui.oidc.bypassProxy }}"
            - name: Helpdesk__URL
              value: "{{ .Values.ui.helpdeskUrl }}"
            - name: DataProtectionSettings__PersistKeys
              value: "{{ .Values.ui.dataProtection.persistKeys }}"
            - name: DataProtectionSettings__KeysPath
              value: "{{ .Values.ui.dataProtection.keysPath }}"
            - name: Serilog__SeqServerUrl
              value: "{{ .Values.global.config.seqUrl }}"
            - name: Serilog__MinimumLevel__Default
              value: "{{ .Values.global.config.logLevel }}"
            - name: Logging__LogLevel__Default
              value: "{{ .Values.global.config.logLevel }}"
            {{- if .Values.global.monitoring.enabled }}
            - name: PUSHGATEWAY_URL
              value: "{{ .Values.global.monitoring.pushgatewayUrl }}"
            - name: PUSHGATEWAY_JOB
              value: {{ .Release.Namespace }}-agent-ui
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
