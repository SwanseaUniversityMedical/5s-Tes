{{- if .Values.rustfs.enabled }}
{{- $kc := urlParse .Values.global.oidc.authority }}
{{- $console := .Values.submission.s3ConsoleUrl | default (printf "%s://rustfs.%s" (ternary "https" "http" .Values.global.ingress.tls) .Values.global.ingress.host) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: {{ .Values.global.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: {{ .Values.global.argoProject }}
  destination:
    namespace: {{ .Values.global.namespace }}
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: "30s"
        factor: 2
        maxDuration: "10m0s"
  source:
    repoURL: "{{ .Values.rustfs.repoURL }}"
    chart: "{{ .Values.rustfs.chart }}"
    # renovate: datasource=helm depName=rustfs registryUrl=https://rustfs.github.io/helm/
    targetRevision: "{{ .Values.rustfs.chartVersion }}"
    helm:
      valuesObject:
        # Default distributed mode needs 4 replicas; we run a single node.
        replicaCount: 1
        mode:
          standalone:
            enabled: true
          distributed:
            enabled: false

        secret:
          existingSecret: submission-rustfs-secret

        # OpenID console login against the realm the api and ui use; the
        # ID token's "policy" claim names the RustFS policies the api creates.
        # RustFS blocks a provider on a private address unless allowlisted.
        extraEnv:
          - name: RUSTFS_IDENTITY_OPENID_ENABLE
            value: "on"
          - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
            value: "{{ .Values.global.oidc.authority }}"
          - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
            value: "{{ .Values.rustfs.oidcClientId }}"
          - name: RUSTFS_IDENTITY_OPENID_SCOPES
            value: "openid"
          - name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME
            value: "policy"
          - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
            value: "off"
          - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
            value: "{{ $console }}/rustfs/admin/v3/oidc/callback/default"
          - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
            value: "Keycloak"
          - name: RUSTFS_OUTBOUND_ALLOW_ORIGINS
            value: "{{ $kc.scheme }}://{{ $kc.host }}"

        service:
          type: {{ .Values.rustfs.service.type }}
          {{- with .Values.rustfs.service.loadBalancerIP }}
          loadBalancerIP: {{ . | quote }}
          {{- end }}

        # Labels every object the chart creates, including its PVCs, so the
        # Velero Schedule's selector in backup.yaml covers rustfs's own data.
        commonLabels:
          {{- toYaml .Values.global.persistentVolumeLabels | nindent 10 }}

        storageclass:
          name: {{ .Values.global.storageClass }}
          dataStorageSize: {{ .Values.rustfs.storageSize }}
          logStorageSize: {{ .Values.rustfs.storageSize }}

        resources:
          requests:
            cpu: {{ .Values.rustfs.resources.requests.cpu }}
            memory: {{ .Values.rustfs.resources.requests.memory }}
          limits:
            memory: {{ .Values.rustfs.resources.limits.memory }}

        {{- if .Values.global.ingress.enabled }}
        ingress:
          enabled: true
          className: {{ .Values.global.ingress.className }}
          hosts:
            - host: rustfs.{{ .Values.global.ingress.host }}
              paths:
                - path: /
                  pathType: Prefix
          # Replaces chart-default annotations, which include forbidden affinity ones.
          nginxAnnotations:
            nginx.ingress.kubernetes.io/affinity: null
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/session-cookie-expires: null
            nginx.ingress.kubernetes.io/session-cookie-hash: null
            nginx.ingress.kubernetes.io/session-cookie-max-age: null
            nginx.ingress.kubernetes.io/session-cookie-name: null
          {{- if .Values.global.ingress.tls }}
          annotations:
            cert-manager.io/cluster-issuer: "{{ .Values.global.ingress.certClusterIssuer }}"
          tls:
            enabled: true
            certManager:
              enabled: true
          {{- end }}
        {{- end }}
{{- end }}
