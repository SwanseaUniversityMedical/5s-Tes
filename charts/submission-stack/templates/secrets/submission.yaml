{{- if and .Values.vault.secretsEnabled .Values.submission.enabled }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: submission-api-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
    # The RabbitmqCluster's own default-user secret (operator key names).
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: rabbitmq
      path: {{ .Values.vault.secretPath }}/rabbitmq
  output:
    name: submission-api-secret
    stringData:
      # Composed here so Vault holds one postgres_password key.
      connectionString: {{ printf "Server=pg-pooler;Port=5432;Database=%s;User Id=postgres;Password={{ .secret.postgres_password }}" .Values.postgres.database | squote }}
      keycloakClientSecret: {{`'{{ .secret.kc_api_client_secret }}'`}}
      keycloakAdminUsername: {{`'{{ .secret.kc_admin_username }}'`}}
      keycloakAdminPassword: {{`'{{ .secret.kc_admin_password }}'`}}
      s3AccessKey: {{`'{{ .secret.s3_access_key }}'`}}
      s3SecretKey: {{`'{{ .secret.s3_secret_key }}'`}}
      rabbitUsername: {{`'{{ .rabbitmq.username }}'`}}
      rabbitPassword: {{`'{{ .rabbitmq.password }}'`}}
    type: Opaque

---

apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: submission-ui-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPeriod: 12h0m0s
  vaultSecretDefinitions:
    - authentication:
        path: {{ .Values.vault.authPath }}
        role: {{ .Values.vault.role }}
        serviceAccount:
          name: default
      name: secret
      path: {{ .Values.vault.secretPath }}
  output:
    name: submission-ui-secret
    stringData:
      keycloakClientSecret: {{`'{{ .secret.kc_ui_client_secret }}'`}}
    type: Opaque
{{- end }}
