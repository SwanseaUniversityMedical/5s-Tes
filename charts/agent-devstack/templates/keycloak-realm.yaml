{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
data:
  # Wildcard redirectUris and ROPC are dev shortcuts; never copy for a real realm.
  dare-tre.json: |-
    {
      "realm": "Dare-TRE",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "Dare-TRE-API",
          "name": "Agent API (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-api",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]{{- if .Values.egress.enabled }},
          "protocolMappers": [
            {
              "name": "audience-dare-tre-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Dare-TRE-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]{{- end }}
        },
        {
          "clientId": "Dare-TRE-UI",
          "name": "Agent UI (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-ui",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "audience-dare-tre-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Dare-TRE-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "Dare-TRE-S3",
          "name": "Agent S3 console (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-s3",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "dare-tre-admin",
            "description": "Admin role gating Agent.Api and Agent.Web admin pages."
          }{{- if .Values.egress.enabled }},
          {
            "name": "data-egress-admin",
            "description": "Required by the egress api's cross-realm calls into Agent.Api."
          }{{- end }}
        ]
      },
      "users": [
        {
          "username": "dev",
          "enabled": true,
          "email": "dev@localtest.me",
          "emailVerified": true,
          "firstName": "Dev",
          "lastName": "User",
          "realmRoles": [
            "default-roles-dare-tre",
            "dare-tre-admin"{{- if .Values.egress.enabled }},
            "data-egress-admin"{{- end }}
          ],
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ]
        }
      ]
    }
  {{- if .Values.egress.enabled }}
  # Both clients carry both audience mappers: the UI forwards its own token
  # to the API, which accepts either audience. The realm-roles mapper on
  # Data-Egress-UI is required: the UI reads claims from the userinfo
  # endpoint, which only includes realm_access when userinfo.token.claim
  # is true.
  data-egress.json: |-
    {
      "realm": "Data-Egress",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "Data-Egress-API",
          "name": "Data Egress API (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-egress-api",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "audience-data-egress-ui",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Data-Egress-UI",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "audience-data-egress-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Data-Egress-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "Data-Egress-UI",
          "name": "Data Egress UI (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-egress-ui",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "audience-data-egress-ui",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Data-Egress-UI",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "audience-data-egress-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Data-Egress-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "user.attribute": "foo",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "multivalued": "true"
              }
            }
          ]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "dare-tre-admin",
            "description": "Required for Agent's cross-realm Data-Egress admin token."
          },
          {
            "name": "data-egress-admin",
            "description": "Admin role gating the Data-Egress API and UI."
          }
        ]
      },
      "users": [
        {
          "username": "dev",
          "enabled": true,
          "email": "dev@localtest.me",
          "emailVerified": true,
          "firstName": "Dev",
          "lastName": "User",
          "realmRoles": [
            "default-roles-data-egress",
            "dare-tre-admin",
            "data-egress-admin"
          ],
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ]
        }
      ]
    }
  {{- end }}
{{- end }}
