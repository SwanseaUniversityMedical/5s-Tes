{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
data:
  # Wildcard redirectUris and ROPC are dev shortcuts; never copy for a real realm.
  # Dare-TRE-API's serviceAccountsEnabled mirrors the production client shape; this
  # realm grants that service account no role, and no chart consumer uses the
  # client-credentials grant — the only grant_type in Agent/ is "password"
  # (Agent.Api/Services/IKeyCloakService.cs:133).
  dare-tre.json: |-
    {
      "realm": "Dare-TRE",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "Dare-TRE-API",
          "name": "Agent API (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-api",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]{{- if .Values.egress.enabled }},
          "protocolMappers": [
            {
              "name": "audience-dare-tre-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Dare-TRE-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]{{- end }}
        },
        {
          "clientId": "Dare-TRE-UI",
          "name": "Agent UI (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-ui",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "audience-dare-tre-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Dare-TRE-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "Dare-TRE-S3",
          "name": "Agent S3 console (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-s3",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "dare-tre-admin",
            "description": "Gates every [Authorize(Roles = \"dare-tre-admin\")] controller in Agent.Api and Agent.Web (e.g. Agent/Agent.Api/Controllers/OnboardingController.cs:11)."
          }{{- if .Values.egress.enabled }},
          {
            "name": "data-egress-admin",
            "description": "Required by the egress api's ROPC role check when it authenticates here as Dare-TRE-API (DARE-Control TreClientWithoutTokenHelper.cs's requiredRole); also accepted by Agent.Api's [Authorize(Roles = \"dare-tre-admin,data-egress-admin\")] endpoints (e.g. SubmissionController.cs:173)."
          }{{- end }}
        ]
      },
      "users": [
        {
          "username": "dev",
          "enabled": true,
          "email": "dev@localtest.me",
          "emailVerified": true,
          "firstName": "Dev",
          "lastName": "User",
          "realmRoles": [
            "default-roles-dare-tre",
            "dare-tre-admin"{{- if .Values.egress.enabled }},
            "data-egress-admin"{{- end }}
          ],
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ]
        }
      ]
    }
  {{- if .Values.egress.enabled }}
  # Data-Egress-API/-UI's serviceAccountsEnabled mirrors the production client
  # shape (DeploymentStack/TRE/config/realm-config/egress-layer.json); no role
  # granted, no verified client-credentials consumer — Agent's cross-realm call
  # uses a password grant, not client_credentials
  # (Agent/Agent.Api/Services/DataEgressClientWithoutTokenHelper.cs:27). Both
  # clients carry both audience mappers, mirroring production's DATA-EGRESS-UI/
  # DATA-EGRESS-API default client scopes on both clients (egress-layer.json
  # clients[].defaultClientScopes) — the UI forwards its own token verbatim to
  # the API, which validates ValidAudiences="Data-Egress-UI,Data-Egress-API"
  # (DARE-Control src/Data-Egress-API/Program.cs:103-106,169). Realm role
  # "dare-tre-admin" gates the ROPC token Agent's cross-realm call requests here
  # (Shared/FiveSafesTes.Core/Services/KeycloakCommon.cs) — same name as the
  # Dare-TRE realm's role above, independent in this realm. Realm role
  # "data-egress-admin" gates nearly every Data-Egress-API/-UI controller
  # ([Authorize(Roles = "data-egress-admin")], DARE-Control
  # src/Data-Egress-API/Controllers/*.cs, src/Data-Egress-UI/Controllers/*.cs).
  # The Dare-TRE realm above also gains two conditional pieces in this same
  # egress.enabled branch: role "data-egress-admin" (granted to its dev user)
  # and a self-audience mapper on Dare-TRE-API — the egress api authenticates
  # into Dare-TRE as Dare-TRE-API via password grant and needs both to reach
  # Agent.Api (DARE-Control TreClientWithoutTokenHelper.cs's requiredRole;
  # Agent's ValidAudiences "Dare-TRE-API,Dare-TRE-UI").
  data-egress.json: |-
    {
      "realm": "Data-Egress",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "Data-Egress-API",
          "name": "Data Egress API (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-egress-api",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "audience-data-egress-ui",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Data-Egress-UI",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "audience-data-egress-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Data-Egress-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "Data-Egress-UI",
          "name": "Data Egress UI (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-egress-ui",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "audience-data-egress-ui",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Data-Egress-UI",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "audience-data-egress-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Data-Egress-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "dare-tre-admin",
            "description": "Required by the ROPC role check for Agent's cross-realm Data-Egress admin token (KeycloakCommon.cs's requiredRole)."
          },
          {
            "name": "data-egress-admin",
            "description": "Gates [Authorize(Roles = \"data-egress-admin\")] controllers across Data-Egress-API and Data-Egress-UI (DARE-Control)."
          }
        ]
      },
      "users": [
        {
          "username": "dev",
          "enabled": true,
          "email": "dev@localtest.me",
          "emailVerified": true,
          "firstName": "Dev",
          "lastName": "User",
          "realmRoles": [
            "default-roles-data-egress",
            "dare-tre-admin",
            "data-egress-admin"
          ],
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ]
        }
      ]
    }
  {{- end }}
{{- end }}
