{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
data:
  # Wildcard redirectUris and ROPC are dev shortcuts; never copy for a real realm.
  # Dare-TRE-API's serviceAccountsEnabled mirrors the production client shape; this
  # realm grants that service account no role, and no chart consumer uses the
  # client-credentials grant — the only grant_type in Agent/ is "password"
  # (Agent.Api/Services/IKeyCloakService.cs:133).
  dare-tre.json: |-
    {
      "realm": "Dare-TRE",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "Dare-TRE-API",
          "name": "Agent API (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-api",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        },
        {
          "clientId": "Dare-TRE-UI",
          "name": "Agent UI (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-ui",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "audience-dare-tre-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "Dare-TRE-API",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "Dare-TRE-S3",
          "name": "Agent S3 console (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-tre-s3",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "dare-tre-admin",
            "description": "Gates every [Authorize(Roles = \"dare-tre-admin\")] controller in Agent.Api and Agent.Web (e.g. Agent/Agent.Api/Controllers/OnboardingController.cs:11)."
          }
        ]
      },
      "users": [
        {
          "username": "dev",
          "enabled": true,
          "email": "dev@localtest.me",
          "emailVerified": true,
          "firstName": "Dev",
          "lastName": "User",
          "realmRoles": [
            "default-roles-dare-tre",
            "dare-tre-admin"
          ],
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ]
        }
      ]
    }
  {{- if .Values.egress.enabled }}
  # Data-Egress-API/-UI's serviceAccountsEnabled mirrors the production client
  # shape (DeploymentStack/TRE/config/realm-config/egress-layer.json); no role
  # granted, no verified client-credentials consumer — Agent's cross-realm call
  # uses a password grant, not client_credentials
  # (Agent/Agent.Api/Services/DataEgressClientWithoutTokenHelper.cs:27). That
  # password-grant token request's role check requires realm role
  # "dare-tre-admin" here too (Shared/FiveSafesTes.Core/Services/KeycloakCommon.cs) —
  # same name as the Dare-TRE realm's role above, an independent role in this
  # realm, matching the production realm export's own role list shape.
  data-egress.json: |-
    {
      "realm": "Data-Egress",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "Data-Egress-API",
          "name": "Data Egress API (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-egress-api",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        },
        {
          "clientId": "Data-Egress-UI",
          "name": "Data Egress UI (dev)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "devsecret-egress-ui",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "dare-tre-admin",
            "description": "Required by the ROPC role check for Agent's cross-realm Data-Egress admin token (KeycloakCommon.cs's requiredRole)."
          }
        ]
      },
      "users": [
        {
          "username": "dev",
          "enabled": true,
          "email": "dev@localtest.me",
          "emailVerified": true,
          "firstName": "Dev",
          "lastName": "User",
          "realmRoles": [
            "default-roles-data-egress",
            "dare-tre-admin"
          ],
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ]
        }
      ]
    }
  {{- end }}
{{- end }}
