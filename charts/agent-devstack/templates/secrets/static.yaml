{{- $ns := .Values.global.namespace }}

# Consumed by agent-stack's CNPG Cluster (superuserSecret).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: "postgres"
  password: "password123"

---

apiVersion: v1
kind: Secret
metadata:
  name: agent-api-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  connectionStringDefault: "Server=pg-pooler;Port=5432;Database=DARE-Tre;User Id=postgres;Password=password123;TrustServerCertificate=True;"
  connectionStringCredentials: "Server=pg-pooler;Port=5432;Database=TRE_Credentials;User Id=postgres;Password=password123;TrustServerCertificate=True;"
  treKeycloakClientSecret: "devsecret-tre-ui"
  # Cross-realm trust: submission-devstack's Dare-Control-API client secret.
  # Only matters if the Submission product is also running locally.
  submissionKeycloakClientSecret: "devsecret-control-api"
  # api.egress.enabled defaults false; unused unless a deployment turns on
  # the Data Egress integration.
  egressKeycloakClientSecret: "dev-egress-unused"
  s3AccessKey: "s3-tre"
  s3SecretKey: "s3-tre-pass"
  rabbitUsername: "agent"
  rabbitPassword: "password123"
  encryptionKey: "ZGV2LWFnZW50LWVuY3J5cHRpb24ta2V5LTMyYnl0ZSE="
  vaultToken: "dev-only-token"
  hangfireUsername: "admin"
  hangfirePassword: "password123"
  # api.hasura.enabled defaults false; unused unless a deployment turns on
  # the Hasura integration.
  hasuraAdminSecret: "dev-hasura-admin-secret-unused"

---

apiVersion: v1
kind: Secret
metadata:
  name: agent-ui-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloakClientSecret: "devsecret-tre-ui"

---

apiVersion: v1
kind: Secret
metadata:
  name: agent-web-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  betterAuthSecret: "dev-agent-betterauth-secret-fixed-32c"
  keycloakClientSecret: "devsecret-tre-ui"

---

apiVersion: v1
kind: Secret
metadata:
  name: credentials-camunda-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  connectionStringCredentials: "Server=pg-pooler;Port=5432;Database=TRE_Credentials;User Id=postgres;Password=password123;TrustServerCertificate=True;"
  # tredata Application below: this devstack's stand-in for the external TRE
  # data database.
  connectionStringTreData: "Server=tredata-postgresql;Port=5432;Database=tredata;User Id=postgres;Password=password123;TrustServerCertificate=True;"
  ldapAdminPassword: "admin"
  vaultToken: "dev-only-token"

---

# Keys the rustfs chart itself reads via envFrom. Values must equal
# agent-api-secret's s3AccessKey/s3SecretKey.
apiVersion: v1
kind: Secret
metadata:
  name: agent-rustfs-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: "s3-tre"
  RUSTFS_SECRET_KEY: "s3-tre-pass"

---

apiVersion: v1
kind: Secret
metadata:
  name: seq-admin-password-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "admin"

{{- if .Values.keycloak.enabled }}
---

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "admin"
{{- end }}

{{- if .Values.adminer.enabled }}
---

apiVersion: v1
kind: Secret
metadata:
  name: adminer-admin-password
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "admin"
{{- end }}

{{- if .Values.openldap.enabled }}
---

# Keys the openldap-stack-ha chart's global.existingSecret contract expects.
# LDAP_ADMIN_PASSWORD must equal credentials-camunda-secret's
# ldapAdminPassword above. Only needed if agent-stack's own openldap.enabled
# is also set true (see README).
apiVersion: v1
kind: Secret
metadata:
  name: agent-openldap-secret
  namespace: {{ $ns }}
  labels:
    {{- include "agent-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  LDAP_ADMIN_PASSWORD: "admin"
  LDAP_CONFIG_ADMIN_PASSWORD: "admin"
{{- end }}
