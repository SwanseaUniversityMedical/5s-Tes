global:
  argoProject: agent
  namespace: 5s-tes-agent

  ingress:
    host: "localtest.me"
    className: "nginx"

keycloak:
  enabled: true
  repoURL: "harbor.ukserp.ac.uk/bitnami/chart"
  chart: keycloak
  # renovate: datasource=helm-oci depName=bitnamicharts/keycloak registryUrl=https://registry-1.docker.io
  chartVersion: "25.4.0"
  # Org mirror for all Bitnami images.
  imageRegistry: "harbor.ukserp.ac.uk"

adminer:
  enabled: true
  repoURL: "https://startechnica.github.io/apps"
  chart: adminer
  # renovate: datasource=helm depName=adminer registryUrl=https://startechnica.github.io/apps
  chartVersion: "0.1.8"

# Dev stand-in for the external TRE data database
# (credentials-camunda-secret's connectionStringTreData).
tredata:
  enabled: true
  repoURL: "harbor.ukserp.ac.uk/bitnami/chart"
  chart: postgresql
  # renovate: datasource=helm-oci depName=bitnamicharts/postgresql registryUrl=https://registry-1.docker.io
  chartVersion: "16.7.21"
  imageRegistry: "harbor.ukserp.ac.uk"
  # The chart's default tag is not mirrored; pin one that is.
  # renovate: datasource=docker depName=bitnami/postgresql registryUrl=https://harbor.ukserp.ac.uk
  imageTag: "17.6.0-debian-12-r4"

# Gates agent-openldap-secret only. The OpenLDAP Application itself is
# agent-stack's own openldap.enabled toggle, set separately on that chart.
openldap:
  enabled: false

# Renders the Data-Egress realm import and the egress static Secrets. Set
# alongside agent-stack's own egress.enabled.
egress:
  enabled: false

# Host-side NodePort Services for a natively-running app (VS Code) to reach
# in-cluster dependencies. See README "Host access for development".
devAccess:
  enabled: true
