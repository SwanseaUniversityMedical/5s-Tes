global:
  argoProject: agent
  namespace: 5s-tes-agent

  ingress:
    host: "localtest.me"
    className: "nginx"

keycloak:
  enabled: true
  repoURL: "harbor.ukserp.ac.uk/bitnami/chart"
  chart: keycloak
  # renovate: datasource=helm-oci depName=bitnamicharts/keycloak registryUrl=https://registry-1.docker.io
  chartVersion: "25.4.0"
  # Org mirror for all Bitnami images.
  imageRegistry: "harbor.ukserp.ac.uk"

adminer:
  enabled: true
  repoURL: "https://startechnica.github.io/apps"
  chart: adminer
  # renovate: datasource=helm depName=adminer registryUrl=https://startechnica.github.io/apps
  chartVersion: "0.1.8"

# Dev stand-in for the external TRE data database (agent-stack's
# credentials-camunda-secret.connectionStringTreData). Not part of
# agent-stack itself; production points that connection string at a real
# external database instead.
tredata:
  enabled: true
  repoURL: "harbor.ukserp.ac.uk/bitnami/chart"
  chart: postgresql
  # renovate: datasource=helm-oci depName=bitnamicharts/postgresql registryUrl=https://registry-1.docker.io
  chartVersion: "18.8.13"
  imageRegistry: "harbor.ukserp.ac.uk"

# Gates agent-openldap-secret only. The OpenLDAP Application itself is
# agent-stack's own openldap.enabled toggle, set separately on that chart.
openldap:
  enabled: false
