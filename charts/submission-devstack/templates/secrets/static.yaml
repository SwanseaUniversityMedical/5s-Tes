{{- $ns := .Values.global.namespace }}

# Consumed by the stack chart's CNPG Cluster (superuserSecret).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: "postgres"
  password: "password123"

---

apiVersion: v1
kind: Secret
metadata:
  name: submission-api-secret
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  connectionString: "Server=pg-pooler;Port=5432;Database=DARE-Control;User Id=postgres;Password=password123;TrustServerCertificate=True;"
  keycloakClientSecret: "devsecret-control-api"
  keycloakAdminUsername: "dare-control-realm-user"
  keycloakAdminPassword: "admin"
  s3AccessKey: "s3-submission"
  s3SecretKey: "s3-submission-pass"
  rabbitUsername: "submission"
  rabbitPassword: "password123"
  vaultToken: "dev-only-token"

---

apiVersion: v1
kind: Secret
metadata:
  name: submission-ui-secret
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloakClientSecret: "devsecret-control-ui"

---

# Keys the rustfs chart itself reads via envFrom. Values must equal
# submission-api-secret's s3AccessKey/s3SecretKey.
apiVersion: v1
kind: Secret
metadata:
  name: submission-rustfs-secret
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: "s3-submission"
  RUSTFS_SECRET_KEY: "s3-submission-pass"

---

apiVersion: v1
kind: Secret
metadata:
  name: seq-admin-password-secret
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "admin"

{{- if .Values.keycloak.enabled }}
---

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "admin"
{{- end }}

{{- if .Values.adminer.enabled }}
---

apiVersion: v1
kind: Secret
metadata:
  name: adminer-admin-password
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "admin"
{{- end }}
