{{- if .Values.devAccess.enabled }}
# Host-side NodePort access for a natively-running app to reach in-cluster
# dependencies at localhost:<port>. Parallel Services with the target's own
# selector copied in; fixed nodePorts match kind-config.yaml's
# extraPortMappings.
{{- $ns := .Values.global.namespace }}

apiVersion: v1
kind: Service
metadata:
  name: dev-pg-pooler
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    cnpg.io/poolerName: pg-pooler
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: pgbouncer
      nodePort: 30432

---

apiVersion: v1
kind: Service
metadata:
  name: dev-rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30672
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 31672

---

apiVersion: v1
kind: Service
metadata:
  name: dev-rustfs
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/name: rustfs
  ports:
    - name: endpoint
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901

---

apiVersion: v1
kind: Service
metadata:
  name: dev-seq
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: seq
    release: seq
  ports:
    - name: ingestion
      port: 5341
      targetPort: ingestion
      nodePort: 30341

---

apiVersion: v1
kind: Service
metadata:
  name: dev-vault
  namespace: {{ $ns }}
  labels:
    {{- include "submission-devstack.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: submission-vault
    app.kubernetes.io/name: vault
    component: server
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30200
{{- end }}
