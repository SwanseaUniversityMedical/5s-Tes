global:
  argoProject: submission
  namespace: 5s-tes-submission

  ingress:
    host: "localtest.me"
    className: "nginx"

keycloak:
  enabled: true
  repoURL: "harbor.ukserp.ac.uk/bitnami/chart"
  chart: keycloak
  # renovate: datasource=helm-oci depName=bitnamicharts/keycloak registryUrl=https://registry-1.docker.io
  chartVersion: "25.4.0"
  # Org mirror for all Bitnami images.
  imageRegistry: "harbor.ukserp.ac.uk"
  # Runs kcadm.sh for templates/keycloak-realm-setup.yaml; match the chart's Keycloak image.
  setupImage: "bitnami/keycloak:26.3.3-debian-12-r0"
  # Dev-only human TRE admin (dare-tre-admin), entered as a TRE's admin username so it can
  # download that TRE's onboarding config. Empty username skips it. Production realms are set up manually.
  treAdmin:
    username: "sailegressapi"
    password: "password123"

adminer:
  enabled: true
  repoURL: "https://startechnica.github.io/apps"
  chart: adminer
  # renovate: datasource=helm depName=adminer registryUrl=https://startechnica.github.io/apps
  chartVersion: "0.1.8"

# Host-side NodePort Services for a natively-running app (VS Code) to reach
# in-cluster dependencies. See README "Host access for development".
devAccess:
  enabled: true
