# Encodes charts/agent-devstack/README.md's "Local install" recipe as a
# values file. See submission-stack-local.yaml for the accessModes-drop and
# agent.enabled=false rationale (same reasons, same mechanism).
global:
  oidc:
    authority: "http://keycloak.agent.localtest.me/realms/Dare-TRE"
  ingress:
    host: "agent.localtest.me"
    tls: false
  storageClass: "standard"
  trustClusterCa:
    enabled: false
  veleroBackup:
    enabled: false
  monitoring:
    enabled: false

vault:
  secretsEnabled: false

rabbitmq:
  vaultDefaultUser: false
  additionalConfig: |
    default_user = agent
    default_pass = password123
    loopback_users.agent = false

agent:
  enabled: false

# Cross-link to the co-located Submission product, on this same cluster.
# oidcAuthority/apiUrl reach the ingress-routed hostnames (CoreDNS rewrites
# *.localtest.me to the ingress controller in-cluster too - see
# files/deps/coredns.yaml), not Submission's (nonexistent locally) public
# URL. s3Url is the one genuine in-cluster Service DNS name (cross-namespace).
submission:
  oidcAuthority: "http://keycloak.submission.localtest.me/realms/Dare-Control"
  apiUrl: "http://submission-api.submission.localtest.me"
  s3Url: "http://rustfs-svc.5s-tes-submission.svc.cluster.local:9000"
