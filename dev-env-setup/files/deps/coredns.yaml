# In-cluster pods resolving *.localtest.me would otherwise hit their own
# loopback (that's the whole point of the localtest.me wildcard domain).
# Rewrite every *.localtest.me query to the ingress controller, not the
# individual Services: the preserved Host header routes via the controller
# to the right family's component. Covers both families' Keycloak hosts
# (submission-api/agent-api OIDC discovery/token validation, agent-api's
# cross-realm Submission OIDC check) and anything else added later.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        rewrite name regex (.*)\.localtest\.me ingress-nginx-controller.ingress-nginx.svc.cluster.local answer auto
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
